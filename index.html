<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signal lost game</title>
    <link rel="style sheet" href="style.css" />
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body>
        <header>
            <h1>SIGNAL LOST</h1>
            <p class="tagline">Survive As Long As You Can</p>
    </header>
    <main>
        <section class="game-container">
         <div id="unity-container" class="unity-desktop">
                 <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
                 <div id="unity-loading-bar">
                     <div id="unity-logo"></div>
                     <div id="unity-progress-bar-empty">
                         <div id="unity-progress-bar-full"></div>                         
                         </div>
                        </div>
                    <div id="unity-warning"> </div>
                    <div id="unity-footer">
                     <div id="unity-logo-title-footer"></div>
                     <div id="unity-fullscreen-button"></div>
                     <div id="unity-build-title">signal-lost-</div>
                    </div>
            </div>
        </section>
            <section class="leaderboard">
            <h2>Top Survivors</h2>
            <ol id="leaderboard-list">
                <li class="loading">Loading Scores...</li>
            </ol>
            <button id="refresh-btn">Refresh</button> 
        </section>
    </main>
    <footer>
        <p>Built for Hack Club Third Space</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
